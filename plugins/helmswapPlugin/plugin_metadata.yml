# Description
short_description: "Swap quotes and wallet-signed token swaps on Base, BNB Chain, Ethereum and other EVM chains"
detailed_description: "Adds a HelmSwap worker with two functions. helmswap_quote returns a read-only quote with expected and minimum output. helmswap_swap gets a quote, requests an unsigned transaction from the public HelmSwap API, and signs and sends it with the agent's own viem wallet, sending a token approval first when needed. HelmSwap never receives a private key and never signs or broadcasts."

